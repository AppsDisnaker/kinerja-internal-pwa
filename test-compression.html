<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Kompresi Gambar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .result { margin-top: 20px; padding: 15px; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; }
        .warning { background: #fff3cd; color: #856404; }
        .danger { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Test Kompresi Gambar < 90KB</h2>
        <div class="mb-3">
            <label for="imageInput" class="form-label">Pilih Gambar:</label>
            <input type="file" class="form-control" id="imageInput" accept="image/*">
        </div>

        <div id="results" class="mt-4"></div>

        <script>
            // Copy compression functions from main app
            function compressImage(file, maxSizeKB = 90, quality = 0.8) {
                return new Promise((resolve) => {
                    const img = new Image();

                    img.onload = function() {
                        // More aggressive compression: try multiple dimension reductions
                        const maxWidths = [1200, 800, 600, 400, 300]; // Progressive size reduction
                        let currentIndex = 0;

                        function tryCompress() {
                            if (currentIndex >= maxWidths.length) {
                                // Final fallback: compress with minimum quality at smallest size
                                const { width, height } = calculateDimensions(img.width, img.height, maxWidths[maxWidths.length - 1]);
                                compressWithDimensions(width, height, file.type, 0.1, maxSizeKB, resolve);
                                return;
                            }

                            const maxWidth = maxWidths[currentIndex];
                            const { width, height } = calculateDimensions(img.width, img.height, maxWidth);

                            compressWithDimensions(width, height, file.type, quality, maxSizeKB, (blob) => {
                                if (blob.size / 1024 <= maxSizeKB) {
                                    resolve(blob);
                                } else {
                                    currentIndex++;
                                    tryCompress(); // Try smaller dimensions
                                }
                            });
                        }

                        tryCompress();
                    };

                    img.src = URL.createObjectURL(file);
                });
            }

            function compressWithDimensions(width, height, mimeType, quality, maxSizeKB, callback) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                canvas.width = width;
                canvas.height = height;

                // Enable high-quality image rendering
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                // Create a temporary image element to draw
                const tempImg = new Image();
                tempImg.onload = function() {
                    ctx.drawImage(tempImg, 0, 0, width, height);

                    // Try different quality levels for current dimensions
                    function tryQuality(currentQuality) {
                        canvas.toBlob((blob) => {
                            const sizeKB = blob.size / 1024;

                            if (sizeKB <= maxSizeKB || currentQuality <= 0.1) {
                                // Target reached or minimum quality
                                callback(blob);
                            } else {
                                // Try lower quality
                                tryQuality(Math.max(0.1, currentQuality - 0.15)); // More aggressive reduction
                            }
                        }, mimeType, currentQuality);
                    }

                    tryQuality(quality);
                };

                tempImg.src = img.src; // Reuse the loaded image
            }

            function calculateDimensions(width, height, maxWidth = 1200) {
                if (width <= maxWidth) {
                    return { width, height };
                }

                const ratio = height / width;
                return {
                    width: maxWidth,
                    height: Math.round(maxWidth * ratio)
                };
            }

            // Test function
            document.getElementById('imageInput').addEventListener('change', async function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const originalSize = (file.size / 1024).toFixed(2);
                const resultsDiv = document.getElementById('results');

                resultsDiv.innerHTML = '<div class="alert alert-info">Memproses gambar...</div>';

                try {
                    const compressedBlob = await compressImage(file);
                    const compressedSize = (compressedBlob.size / 1024).toFixed(2);
                    const isUnder90KB = compressedBlob.size <= (90 * 1024);

                    const resultClass = isUnder90KB ? 'success' : 'warning';
                    const resultIcon = isUnder90KB ? '✓' : '⚠';
                    const resultText = isUnder90KB ? 'BERHASIL' : 'GAGAL';

                    resultsDiv.innerHTML = `
                        <div class="result ${resultClass}">
                            <h5>${resultIcon} Kompresi ${resultText}</h5>
                            <p><strong>File Asli:</strong> ${originalSize} KB</p>
                            <p><strong>Setelah Kompresi:</strong> ${compressedSize} KB</p>
                            <p><strong>Target ≤90KB:</strong> ${isUnder90KB ? '✓ Terpenuhi' : '✗ Tidak terpenuhi'}</p>
                            <p><strong>Reduksi:</strong> ${((1 - compressedBlob.size / file.size) * 100).toFixed(1)}%</p>
                        </div>
                        <div class="mt-3">
                            <h6>Preview Hasil Kompresi:</h6>
                            <img src="${URL.createObjectURL(compressedBlob)}" class="img-fluid" style="max-height: 300px;" alt="Compressed image">
                        </div>
                    `;

                    console.log(`Compression Test: ${file.name}`);
                    console.log(`Original: ${originalSize}KB, Compressed: ${compressedSize}KB, Under 90KB: ${isUnder90KB}`);

                } catch (error) {
                    resultsDiv.innerHTML = `
                        <div class="result danger">
                            <h5>✗ Error Kompresi</h5>
                            <p>${error.message}</p>
                        </div>
                    `;
                    console.error('Compression test failed:', error);
                }
            });
        </script>
    </div>
</body>
</html>
